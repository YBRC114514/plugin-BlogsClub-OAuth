apiVersion: v1alpha1
kind: Role
metadata:
  name: plugin-blogsclub-role-template
  labels:
    halo.run/hidden: "true"
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-authenticated: "true"
  annotations:
    rbac.authorization.halo.run/module: "Authentication"
    rbac.authorization.halo.run/display-name: "BlogsClub AccessRole"
rules:
  - apiGroups: [ "api.plugin.halo.run" ]
    resourceNames: [ "plugin-blogsclub" ]
    resources: [ "plugins/connect", "plugins/disconnect" ]
    verbs: [ "get", "list", "update" ]
